
services:
  mongodb:
    image: mongo:7
    container_name: facturaflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mailpit:
    image: axllent/mailpit:latest
    container_name: facturaflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend/FacturaFlow.Api
      dockerfile: Dockerfile
    container_name: facturaflow-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      Mongo__ConnectionString: mongodb://mongodb:27017
      Mongo__Database: facturaflow
      Mongo__Collection: facturas
      Email__Host: mailpit
      Email__Port: "1025"
      Email__EnableSsl: "false"
      Email__DryRun: "false"
      FrontendOrigin: http://localhost:4200
    depends_on:
      - mongodb
      - mailpit

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facturaflow-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  mongo_data:
